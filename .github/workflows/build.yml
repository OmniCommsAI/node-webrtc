name: Build wrtc.node

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-linux-x64:
    if: false  # Disabled until win32-x64 build is fixed
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # libwebrtc compilation units can use 1-2GB RAM each.
      # ubuntu-latest only has 7GB RAM, so add 10GB swap to prevent OOM.
      - name: Add swap space
        run: |
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Swap enabled:"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config \
            libglib2.0-dev libgtk-3-dev libpulse-dev libasound2-dev \
            llvm lld clang

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Create nix.gni
        run: printf 'is_clang=true\nuse_lld=false\nclang_use_chrome_plugins=false\ntreat_warnings_as_errors=false\n' > nix.gni

      - name: Build
        env:
          TARGET_ARCH: x64
          NINJA_JOBS: "2"
          CC: clang
          CXX: clang++
        run: npm run build

      - name: Copy to prebuilds
        run: cp build-linux-x64/Release/wrtc.node prebuilds/linux-x64/wrtc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-linux-x64
          path: prebuilds/linux-x64/wrtc.node

      - name: Commit prebuild
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f prebuilds/linux-x64/wrtc.node
          git diff --cached --quiet || git commit -m "build: update linux-x64 prebuild binary"
          git pull --rebase origin develop
          git push

  build-linux-arm64:
    if: false  # Disabled until win32-x64 build is fixed
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add swap space
        run: |
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Swap enabled:"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config \
            libglib2.0-dev libgtk-3-dev libpulse-dev libasound2-dev \
            llvm lld clang-15
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100

      # depot_tools and the libwebrtc source tree bundle x64-only `gn` binaries
      # at buildtools/linux64/gn. On ARM64 runners these cause "Exec format error".
      # We download a native ARM64 gn and replace the x64 binaries in-place after
      # the CMake download step extracts them. We also put it on PATH so
      # configure-webrtc.sh's `gn gen` call finds it.
      - name: Install native ARM64 gn binary
        run: |
          mkdir -p ${{ github.workspace }}/gn-arm64
          curl -sL "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-arm64/+/latest" -o /tmp/gn.zip
          unzip -o /tmp/gn.zip -d ${{ github.workspace }}/gn-arm64
          chmod +x ${{ github.workspace }}/gn-arm64/gn

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # clang_base_path tells GN to use system clang instead of the bundled
      # x64 clang at third_party/llvm-build/ which can't run on ARM64.
      - name: Create nix.gni
        run: printf 'is_clang=true\nuse_lld=false\nclang_use_chrome_plugins=false\ntreat_warnings_as_errors=false\nclang_base_path="/usr/lib/llvm-15"\n' > nix.gni

      - name: Build
        env:
          TARGET_ARCH: arm64
          NINJA_JOBS: "2"
          CC: clang
          CXX: clang++
          GN_ARM64_BIN: ${{ github.workspace }}/gn-arm64/gn
        run: npm run build

      - name: Copy to prebuilds
        run: cp build-linux-arm64/Release/wrtc.node prebuilds/linux-arm64/wrtc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-linux-arm64
          path: prebuilds/linux-arm64/wrtc.node

      - name: Commit prebuild
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f prebuilds/linux-arm64/wrtc.node
          git diff --cached --quiet || git commit -m "build: update linux-arm64 prebuild binary"
          git pull --rebase origin develop
          git push

  build-darwin-arm64:
    if: false  # Disabled until win32-x64 build is fixed
    # Pin to macos-14 (Xcode 15.x). macos-latest resolves to macOS 15 with
    # Xcode 16.4 whose SDK headers are incompatible with the bundled M98-era
    # clang in libwebrtc (NSUInteger/NSInteger type errors).
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # macOS runners have 14GB RAM — no swap needed.
      - name: Install build dependencies
        run: brew install ninja cmake

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # Detect the Xcode system clang base path. The bundled M98-era clang
      # can't compile against modern macOS SDK headers (noErr undeclared,
      # NSUInteger unknown type). Using system Apple clang avoids this,
      # analogous to how linux-arm64 uses clang_base_path="/usr/lib/llvm-15".
      - name: Detect system clang path
        run: |
          CLANG_BASE_PATH=$(dirname $(dirname $(xcrun --find clang)))
          echo "CLANG_BASE_PATH=$CLANG_BASE_PATH" >> $GITHUB_ENV
          echo "Using system clang at: $CLANG_BASE_PATH"

      # macOS uses Apple clang which is already is_clang=true compatible.
      # clang_base_path tells GN to use system clang instead of the bundled
      # x64 clang at third_party/llvm-build/ which is incompatible with
      # modern macOS SDK headers.
      - name: Create nix.gni
        run: printf 'is_clang=true\nuse_lld=false\nclang_use_chrome_plugins=false\ntreat_warnings_as_errors=false\nclang_base_path="%s"\n' "$CLANG_BASE_PATH" > nix.gni

      - name: Build
        env:
          TARGET_ARCH: arm64
          NINJA_JOBS: "3"
        run: npm run build

      - name: Copy to prebuilds
        run: cp build-darwin-arm64/Release/wrtc.node prebuilds/darwin-arm64/wrtc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-darwin-arm64
          path: prebuilds/darwin-arm64/wrtc.node

      - name: Commit prebuild
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f prebuilds/darwin-arm64/wrtc.node
          git diff --cached --quiet || git commit -m "build: update darwin-arm64 prebuild binary"
          git pull --rebase origin develop
          git push

  # darwin-x64 build disabled: GitHub removed all macos-13 runners (Intel)
  # and no x64 macOS runners are available. Intel Macs are phasing out.
  # Re-enable if GitHub adds x64 macOS runners or cross-compilation is set up.

  build-win32-x64:

    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Windows runners come with MSVC pre-installed.
      # depot_tools' vs_toolchain.py finds it via DEPOT_TOOLS_WIN_TOOLCHAIN=0.
      - name: Install build dependencies
        run: choco install ninja cmake --no-progress -y

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # Windows uses MSVC, not clang from GN's perspective for linking.
      # is_clang=true tells GN to download and use its own clang-cl for compilation
      # while still using MSVC linker. treat_warnings_as_errors=false prevents
      # M98-era code from failing with newer toolchains.
      - name: Create nix.gni
        run: |
          @"
          is_clang=true
          use_lld=false
          clang_use_chrome_plugins=false
          treat_warnings_as_errors=false
          "@ | Out-File -FilePath nix.gni -Encoding utf8NoBOM

      - name: Build
        env:
          TARGET_ARCH: x64
          NINJA_JOBS: "2"
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
          GYP_MSVS_VERSION: "2022"
        run: npm run build

      - name: Copy to prebuilds
        run: Copy-Item build-win32-x64\Release\wrtc.node prebuilds\win32-x64\wrtc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-win32-x64
          path: prebuilds/win32-x64/wrtc.node

      - name: Commit prebuild
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f prebuilds/win32-x64/wrtc.node
          git diff --cached --quiet || git commit -m "build: update win32-x64 prebuild binary"
          git pull --rebase origin develop
          git push
