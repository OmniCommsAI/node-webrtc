name: Build wrtc.node

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config \
            libglib2.0-dev libgtk-3-dev libpulse-dev libasound2-dev \
            clang-14 lld-14

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Create nix.gni
        run: |
          cat > nix.gni <<'EOF'
          is_clang=true
          use_lld=false
          clang_use_chrome_plugins=false
          clang_base_path="/usr/lib/llvm-14"
          treat_warnings_as_errors=false
          EOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' nix.gni

      - name: Build
        env:
          TARGET_ARCH: x64
        run: npm run build

      - name: Copy to prebuilds
        run: cp build-linux-x64/Release/wrtc.node prebuilds/linux-x64/wrtc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-linux-x64
          path: prebuilds/linux-x64/wrtc.node

      - name: Commit prebuild
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f prebuilds/linux-x64/wrtc.node
          git diff --cached --quiet || git commit -m "build: update linux-x64 prebuild binary"
          git push
